name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (EdgeTX ${{ matrix.edgetx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edgetx: [v2.10.0, v2.10.6, v2.10.7, v2.11.8, v2.12.5]
    steps:
      - uses: actions/checkout@v4

      - name: Check out EdgeTX ${{ matrix.edgetx }} in the submodule
        run: |
          git submodule update --init --depth 1 third_party/edgetx
          scripts/checkout-edgetx.sh ${{ matrix.edgetx }}

      - name: Install build dependencies
        run: scripts/setup-deps.sh

      - name: Build backends
        run: |
          scripts/build.sh tx16s
          scripts/build.sh pocket
          dist/bin/edgetx-lint list

      - name: Test
        run: python3 tests/run_tests.py --bin-dir dist/bin

      - uses: actions/upload-artifact@v4
        with:
          name: edgetx-lint-${{ matrix.edgetx }}-linux-x64
          path: dist/
          retention-days: 7

  # Loads ./action.yml (manifest + composite steps) against the latest
  # published release, so a broken action manifest fails the PR.
  action:
    name: action (${{ matrix.case }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: valid, files: "tests/fixtures/tx16s/valid/*.yml tests/fixtures/tx16s/valid/RADIO/radio.yml", want: "0"}
          - {case: broken, files: "tests/fixtures/tx16s/broken/typo-key.yml", want: "1"}
    steps:
      - uses: actions/checkout@v4
      - id: lint
        uses: ./
        continue-on-error: true
        with:
          radio: tx16s
          edgetx: v2.12.5
          files: ${{ matrix.files }}
          version: latest
      - name: Exit code is ${{ matrix.want }}
        run: test "${{ steps.lint.outputs.exit-code }}" = "${{ matrix.want }}"

  # Single stable check name for branch protection / rulesets.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, action]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.action.result }}" = success
