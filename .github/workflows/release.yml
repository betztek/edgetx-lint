name: Release

# Two ways to release:
#  - push a tag like v0.1.0, or
#  - run this workflow manually on a branch (usually main) with input tag:
#    the release and its tag are created at that branch's commit.
# Builds every radio x EdgeTX backend, tests them, publishes
# edgetx-lint-linux-x64.tar.gz (+ .sha256), then smoke-tests the published
# GitHub Action against the fixtures.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, e.g. v0.1.0 (must match VERSION)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        edgetx: [v2.10.6, v2.10.7, v2.11.8, v2.12.5]
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "$TAG"
      - run: |
          git submodule update --init --depth 1 third_party/edgetx
          scripts/checkout-edgetx.sh ${{ matrix.edgetx }}
      - run: scripts/setup-deps.sh
      - run: |
          scripts/build.sh tx16s
          scripts/build.sh pocket
          python3 tests/run_tests.py --bin-dir dist/bin
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.edgetx }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: pkg/
      - name: Package
        run: |
          chmod +x pkg/bin/* pkg/libexec/edgetx-lint/*
          cp README.md LICENSE pkg/
          tar -C pkg -czf edgetx-lint-linux-x64.tar.gz .
          sha256sum edgetx-lint-linux-x64.tar.gz > edgetx-lint-linux-x64.tar.gz.sha256
          tar -tzf edgetx-lint-linux-x64.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="edgetx-lint-linux-x64.tar.gz edgetx-lint-linux-x64.tar.gz.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            # creates the tag at this commit when it does not exist yet
            gh release create "$TAG" $files --target "$GITHUB_SHA" \
              --title "edgetx-lint $TAG" --generate-notes
          fi

  # Releases made with GITHUB_TOKEN do not trigger other workflows, so the
  # published Action is tested here, against the asset just uploaded.
  action-smoke-test:
    needs: publish
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {radio: tx16s, edgetx: v2.12.5, files: "tests/fixtures/tx16s/valid/*.yml tests/fixtures/tx16s/valid/RADIO/radio.yml", want: "0"}
          - {radio: tx16s, edgetx: v2.12.5, files: "tests/fixtures/tx16s/broken/typo-key.yml", want: "1"}
          - {radio: pocket, edgetx: v2.10.6, files: "tests/fixtures/pocket/valid/**/*.yml", want: "0"}
          - {radio: pocket, edgetx: v2.10.6, files: "tests/fixtures/pocket/broken/lowercase-hex-escape.yml", want: "1"}
    steps:
      - uses: actions/checkout@v4
      - id: lint
        uses: ./
        continue-on-error: true
        with:
          radio: ${{ matrix.radio }}
          edgetx: ${{ matrix.edgetx }}
          files: ${{ matrix.files }}
          version: ${{ env.TAG }}
      - name: Exit code is ${{ matrix.want }}
        run: test "${{ steps.lint.outputs.exit-code }}" = "${{ matrix.want }}"
