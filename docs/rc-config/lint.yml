# Drop-in workflow for betztek/rc-config .github/workflows/lint.yml.
# rc-config runs this exact file (merged via rc-config PR #13); keep both in
# sync when changing it.
#
# - `lint` lints each radio against the EdgeTX version it RUNS TODAY.
#   Keep it in step with SDCARD.md: after a firmware upgrade, change the
#   `edgetx` value in the same PR that commits the upgraded files.
# - `preview` lints the same files against the next EdgeTX release. It never
#   blocks; version traps show up as annotations before upgrading.
# - `docs` fails if docs/ is stale (CLAUDE.md: rerun build_docs.py on model or
#   notes changes and commit the result).
# - `ci-ok` is the one check that gates merges. It passes only if every `lint`
#   leg and `docs` passed. Changing a version or adding a radio (one matrix
#   line in `lint`, optionally in `preview`) changes nothing else. rc-config is
#   private on a free plan, so GitHub doesn't enforce it; CLAUDE.md → Git does.
#
# Verified 2026-11-26 against main (46d2c51) with the edgetx-lint v0.1.1
# release: every blocking and preview combination gives 0 errors and
# 0 warnings, and build_docs.py reproduces docs/ with no diff.

name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.radio }} on EdgeTX ${{ matrix.edgetx }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {radio: tx16s,  edgetx: v2.10.6}
          - {radio: pocket, edgetx: v2.10.0}
    steps:
      - uses: actions/checkout@v4
      - uses: betztek/edgetx-lint@v0.1.1
        with:
          radio: ${{ matrix.radio }}
          edgetx: ${{ matrix.edgetx }}
          files: ${{ matrix.radio }}/MODELS/*.yml ${{ matrix.radio }}/RADIO/radio.yml
          args: --quiet

  preview:
    name: ${{ matrix.radio }} on EdgeTX ${{ matrix.edgetx }} (upgrade preview)
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {radio: tx16s,  edgetx: v2.12.5}
          - {radio: pocket, edgetx: v2.12.5}
    steps:
      - uses: actions/checkout@v4
      - uses: betztek/edgetx-lint@v0.1.1
        with:
          radio: ${{ matrix.radio }}
          edgetx: ${{ matrix.edgetx }}
          files: ${{ matrix.radio }}/MODELS/*.yml ${{ matrix.radio }}/RADIO/radio.yml
          args: --quiet

  docs:
    name: docs up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - name: Regenerate docs
        run: |
          python3 scripts/build_docs.py tx16s
          python3 scripts/build_docs.py pocket
      - name: docs/ must match
        run: git diff --exit-code -- docs/

  # Single stable merge gate. `preview` is deliberately not in needs.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: lint=${{ needs.lint.result }} docs=${{ needs.docs.result }}
        run: test "${{ needs.lint.result }}" = success && test "${{ needs.docs.result }}" = success
